<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolfcraft — Dev</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      padding: 32px;
    }

    h1 {
      color: #f0e6a0;
      font-size: 22px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      font-size: 12px;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .section-title {
      color: #7aa2d4;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e2a3a;
      padding-bottom: 6px;
    }

    .animals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #21262d;
    }

    .card-name {
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .card-name.deer   { color: #d4a060; }
    .card-name.rabbit { color: #cccccc; }
    .card-name.pig    { color: #e09070; }
    .card-name.wolf   { color: #ff6644; }

    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge-nocturnal { background: #1a1040; color: #9966ff; border: 1px solid #442266; }
    .badge-hunter    { background: #3a0a0a; color: #ff4444; border: 1px solid #661111; }
    .badge-passive   { background: #0a200a; color: #44cc44; border: 1px solid #115511; }

    .card-body {
      padding: 14px 18px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #1a1f27;
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-key   { color: #6e7681; font-size: 12px; }
    .stat-val   { color: #e6edf3; font-size: 12px; }
    .stat-val.fast   { color: #44cc88; }
    .stat-val.medium { color: #ddaa00; }
    .stat-val.slow   { color: #ff6644; }

    .stat-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-track {
      width: 80px;
      height: 4px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .card-footer {
      padding: 12px 18px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.1s, border-color 0.1s;
    }

    .btn:hover { background: #2d333b; border-color: #484f58; }
    .btn:active { background: #1c2128; }

    .btn-play {
      background: #0d2818;
      border-color: #1a4d2e;
      color: #44cc88;
    }

    .btn-play:hover  { background: #112d1c; border-color: #246637; }
    .btn-play.active { background: #0a1f12; color: #22ff66; border-color: #22ff66; }

    .btn-howl {
      background: #200a0a;
      border-color: #5c1111;
      color: #ff6644;
    }

    .btn-howl:hover { background: #2a0d0d; border-color: #7a1a1a; }

    /* Sounds section */
    .sounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 48px;
    }

    .sound-btn {
      background: #161b22;
      border: 1px solid #21262d;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      letter-spacing: 1px;
      transition: background 0.1s, border-color 0.1s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-btn:hover { background: #1c2128; border-color: #30363d; }

    .sound-icon { font-size: 18px; }

    .sound-label { flex: 1; }
    .sound-name  { color: #e6edf3; margin-bottom: 2px; }
    .sound-desc  { color: #484f58; font-size: 11px; }

    /* Master controls */
    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 32px;
      padding: 14px 18px;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
    }

    .control-label { color: #6e7681; font-size: 12px; }

    input[type="range"] {
      accent-color: #44cc88;
      width: 120px;
    }

    #vol-display { color: #44cc88; font-size: 12px; min-width: 36px; }

    a.back {
      display: inline-block;
      margin-bottom: 28px;
      color: #484f58;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1px;
    }

    a.back:hover { color: #7aa2d4; }
  </style>
</head>
<body>
  <a class="back" href="/wolfcraft/">← back to game</a>
  <h1>Wolfcraft Dev</h1>
  <p class="subtitle">animal configs &amp; sound playground</p>

  <div class="controls-row">
    <span class="control-label">MASTER VOL</span>
    <input type="range" id="vol-slider" min="0" max="100" value="60" />
    <span id="vol-display">60%</span>
  </div>

  <p class="section-title">Animals</p>
  <div class="animals-grid" id="animals-grid"></div>

  <p class="section-title">All Sounds</p>
  <div class="sounds-grid" id="sounds-grid"></div>

  <script type="module" src="/src/dev.ts"></script>
</body>
</html>
